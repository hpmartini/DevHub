name: Release

# Baut die Electron-App für macOS/Windows/Linux und hängt die Installer an das Release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, flags: '--mac --arm64' }
          - { os: macos-15-intel, flags: '--mac --x64' }
          - { os: windows-2022, flags: '--win --x64' }
          - { os: ubuntu-latest, flags: '--linux --x64' }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.18

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build && bun run bundle:server

      # Ohne Apple-Zertifikat: ad-hoc-Signatur, keine Notarisierung (Skript überspringt sie ohne APPLE_ID).
      - name: Package installers
        run: bunx electron-builder ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload to release
        shell: bash
        run: |
          files=$(find dist-electron -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \))
          gh release upload "${{ github.event.release.tag_name }}" $files --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
