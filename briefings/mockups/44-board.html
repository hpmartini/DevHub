<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevOrbit Board</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
  // Same tokens as DevOrbit's index.html (Ghostty blue scale)
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },

      gray: { 50:'#f6f8fd',100:'#eaeff9',200:'#d6dff1',300:'#c4d0ea',400:'#b8c7e6',500:'#adbde0',600:'#94a8d6',700:'#4f67a0',750:'#3b5081',800:'#344a7b',850:'#2c4070',900:'#243562',950:'#1a274b' },

<style>
  :root { --bg-app:#243562; --bg-card:#2c4070; --border:#4f67a0; --text:#d6dff1; --scrollbar:#5c73a8; }
  html { color-scheme: dark; scrollbar-color: var(--scrollbar) var(--bg-app); }
  body { background: var(--bg-app); color: var(--text); font-feature-settings: 'tnum'; }
  ::selection { background: #3f6399; color: #fff; }
  :focus-visible { outline: 2px solid #8fd0ff; outline-offset: 2px; }
  .thin-scrollbar { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
  .card[draggable="true"] { cursor: grab; }
  .card.dragging { opacity: .4; }
  .drop-target { background: rgba(143,208,255,.08); box-shadow: inset 0 0 0 1px rgba(143,208,255,.45); }
  .lane-cell { min-height: 3.25rem; }
  .flash { animation: flash 1.2s cubic-bezier(.16,1,.3,1); }
  @keyframes flash { from { box-shadow: 0 0 0 2px #8fd0ff, 0 6px 18px -6px rgba(0,0,0,.6); } to { box-shadow: 0 1px 2px rgba(0,0,0,.25); } }
  .drawer { transition: transform .28s cubic-bezier(.16,1,.3,1); }
  @media (prefers-reduced-motion: reduce) { .drawer, .flash { transition: none; animation: none; } }
  .kbd { display:inline-block; padding:0 .35rem; border:1px solid var(--border); border-bottom-width:2px; border-radius:.25rem; background:#1a274b; color:#b9d6ff; font-family:ui-monospace,Menlo,monospace; font-size:.7rem; }
  .note { position: relative; }
</style>
</head>
<body class="font-sans text-sm h-screen overflow-hidden">
<div class="flex h-full">

  <!-- Rail: same shell as /agents (RailNav + sections) -->
  <aside class="w-80 shrink-0 flex flex-col border-r border-gray-700 bg-gray-900" aria-label="Board navigation">
    <div class="px-3 py-2 border-b border-gray-700 space-y-2 shrink-0">
      <nav class="flex items-center gap-1 text-xs" aria-label="Modus">
        <a href="#" class="flex items-center gap-1.5 px-2 py-1 rounded text-gray-400 hover:text-white hover:bg-gray-800"><i data-lucide="layout-dashboard" class="w-[13px] h-[13px]"></i> Dashboard</a>
        <span class="flex items-center gap-1.5 px-2 py-1 rounded bg-gray-800 text-white" aria-current="page"><i data-lucide="kanban" class="w-[13px] h-[13px]"></i> Board</span>
        <a href="#" class="flex items-center gap-1.5 px-2 py-1 rounded text-gray-400 hover:text-white hover:bg-gray-800"><i data-lucide="bot" class="w-[13px] h-[13px]"></i> Agents</a>
        <div class="flex-1"></div>
        <button class="p-1.5 rounded text-gray-400 hover:text-white hover:bg-gray-800" title="Board-Einstellungen (Quelle: MACC)" aria-label="Settings"><i data-lucide="settings" class="w-[13px] h-[13px]"></i></button>
      </nav>
      <div class="flex rounded border border-gray-700 bg-gray-900 p-0.5 text-xs" role="group" aria-label="Slice nach">
        <!-- filled by JS -->
      </div>
    </div>

    <div class="flex-1 overflow-y-auto thin-scrollbar pb-3">
      <section class="mx-2 mt-2 rounded-lg border border-gray-700 bg-gray-850 overflow-hidden">
        <h2 class="flex items-center gap-2 px-3 py-2 text-xs font-semibold text-gray-300 bg-gray-800 border-b border-gray-700">
          <i data-lucide="layers" class="w-3 h-3"></i><span id="sliceTitle">Projekte</span>
          <span class="font-normal text-gray-400" id="sliceMeta"></span>
        </h2>
        <ul id="sliceList" class="py-1"></ul>
      </section>

      <section class="mx-2 mt-2 rounded-lg border border-gray-700 bg-gray-850 overflow-hidden">
        <h2 class="flex items-center gap-2 px-3 py-2 text-xs font-semibold text-gray-300 bg-gray-800 border-b border-gray-700">
          <i data-lucide="bot" class="w-3 h-3"></i>Agents
          <span class="font-normal text-gray-400" id="agentMeta"></span>
        </h2>
        <ul id="agentList" class="py-1"></ul>
        <p class="px-3 py-2 text-[11px] leading-snug text-gray-400 border-t border-gray-700">Klick auf einen Agent filtert das Board auf seine Issues. Nochmal klicken hebt den Filter auf.</p>
      </section>
    </div>
  </aside>

  <!-- Board -->
  <main class="flex-1 min-w-0 flex flex-col">
    <header class="flex items-center gap-3 px-4 h-12 border-b border-gray-700 bg-gray-900 shrink-0">
      <h1 class="text-[15px] font-semibold text-white flex items-center gap-2">
        <span id="boardTitle">DevHub</span>
        <span class="text-xs font-normal text-gray-400" id="boardCount"></span>
      </h1>
      <div id="filterChips" class="flex items-center gap-1.5"></div>
      <div class="flex-1"></div>
      <label class="flex items-center gap-1.5 text-xs text-gray-400">Swimlanes
        <select id="laneMode" class="bg-gray-850 border border-gray-700 rounded px-2 py-1 text-gray-200 text-xs">
          <option value="parent">Parent issue</option>
          <option value="repo">Repository</option>
          <option value="none">Keine</option>
        </select>
      </label>
      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input id="q" type="search" placeholder="Filtern: Titel, #Nr, label:ui" class="w-56 bg-gray-850 border border-gray-700 rounded pl-7 pr-2 py-1 text-xs text-gray-100 placeholder:text-gray-400" />
      </div>
      <span class="text-[11px] text-gray-400 flex items-center gap-1" title="Quelle: GitHub Project MACC (users/hpmartini/projects/4), Status-Feld aller Items"><i data-lucide="refresh-cw" class="w-3 h-3"></i>MACC · vor 12 s</span>
    </header>

    <div id="board" class="flex-1 overflow-auto thin-scrollbar"></div>
  </main>

  <!-- Detail drawer -->
  <aside id="drawer" class="drawer fixed top-0 right-0 h-full w-[420px] max-w-full bg-gray-900 border-l border-gray-700 shadow-[0_0_40px_-8px_rgba(0,0,0,.6)] translate-x-full flex flex-col" aria-label="Issue-Details" aria-hidden="true"></aside>
</div>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 px-3 py-2 rounded-md bg-gray-950 border border-gray-700 text-xs text-gray-100 shadow-lg opacity-0 pointer-events-none transition-opacity" role="status"></div>

function renderSlices() {
  const counts = new Map();
  const add = (k) => counts.set(k, (counts.get(k) || 0) + 1);
  if (state.sliceMode === 'repo') ITEMS.forEach(i => add(i.r));
  if (state.sliceMode === 'label') ITEMS.forEach(i => i.l.forEach(l => add(l[0])));
  const active = (k) => ITEMS.filter(i => i.r === k && ['In Progress','to Review','to Deploy'].includes(i.s)).length;
  const byDefault = (a, b) => (state.sliceMode === 'repo' ? active(b[0]) - active(a[0]) : 0) || b[1] - a[1];
  // Manual order wins; projects never dragged keep the default ranking below the ordered ones
  const pos = (k) => { const i = prefs.order.indexOf(k); return i < 0 ? Infinity : i; };
  const rows = [...counts].sort((a, b) => (state.sliceMode === 'repo' ? (pos(a[0]) - pos(b[0]) || 0) : 0) || byDefault(a, b));

  const rest = rows.filter(r => !fav.includes(r) && !hidden.includes(r));
  document.getElementById('sliceMeta').textContent = `${rows.length - hidden.length}`;

  const row = ([key, n], kind) => {
    const on = state.slice === key, pinned = prefs.pinned.includes(key);
    const act = repoMode && active(key) ? `<span class="text-[10.5px] text-emerald-300 tabular-nums" title="aktiv (In Progress bis to Deploy)">${active(key)} aktiv</span>` : '';
    return `<li data-row="${esc(key)}" ${repoMode && kind !== 'hidden' ? 'draggable="true"' : ''} class="slice-row group relative flex items-center gap-1 pl-1 pr-2 ${on ? 'bg-sel text-white' : 'text-gray-300 hover:bg-gray-800'} ${kind === 'hidden' ? 'opacity-70' : ''}">

          : `<button data-pin="${esc(key)}" class="p-1 rounded ${pinned ? 'text-yellow-300' : 'text-gray-300'} hover:text-white hover:bg-gray-700" title="${pinned ? 'Favorit entfernen' : 'Als Favorit anpinnen'}" aria-label="${esc(key)} ${pinned ? 'lösen' : 'anpinnen'}" aria-pressed="${pinned}"><i data-lucide="star" class="w-3 h-3"></i></button>
             <button data-hide="${esc(key)}" class="p-1 rounded text-gray-300 hover:text-white hover:bg-gray-700" title="Ausblenden" aria-label="${esc(key)} ausblenden"><i data-lucide="eye-off" class="w-3 h-3"></i></button>`}
      </span>` : ''}
      ${pinned && kind === 'fav' ? `<i data-lucide="star" class="w-3 h-3 text-yellow-300 fill-yellow-300 shrink-0 group-hover:hidden group-focus-within:hidden"></i>` : ''}
    </li>`;
  };
  const head = (t) => `<li class="px-3 pt-2 pb-0.5 text-[10.5px] font-semibold uppercase tracking-wide text-gray-400">${t}</li>`;

  const chips = [];
  if (state.agent) { const a = AGENTS.find(x => x.id === state.agent); chips.push(['agent', `Agent: ${a.name}`]); }
  if (state.q) chips.push(['q', `„${state.q}“`]);
  document.getElementById('filterChips').innerHTML = chips.map(([k, t]) => `<button data-clear="${k}" class="flex items-center gap-1 px-2 py-0.5 rounded-full bg-sel text-white text-xs hover:bg-gray-750" aria-label="Filter ${esc(t)} entfernen">${esc(t)}<i data-lucide="x" class="w-3 h-3"></i></button>`).join('');
  document.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => { if (b.dataset.clear === 'agent') state.agent = null; else { state.q = ''; document.getElementById('q').value = ''; } render(); });
}

function card(it) {
  const ags = agentsFor(it), prs = prsFor(it);
  const ci = { success:['check-circle-2','text-emerald-400','CI grün'], failure:['x-circle','text-red-300','CI rot'], pending:['circle-dashed','text-yellow-400','CI läuft'] };
  return `<article draggable="true" data-key="${keyOf(it.r, it.n)}" tabindex="0" class="card group rounded-md border border-gray-700 bg-gray-850 hover:border-gray-600 hover:bg-gray-800 px-2.5 py-2 shadow-[0_1px_2px_rgba(0,0,0,.25)] ${state.open === keyOf(it.r, it.n) ? 'ring-1 ring-cursor' : ''}">
    <div class="flex items-center gap-1.5 text-[11px] text-gray-400">
      <i data-lucide="${it.k === 'pr' ? 'git-pull-request' : it.st === 'CLOSED' ? 'circle-check' : 'circle-dot'}" class="w-3 h-3 ${it.st === 'CLOSED' ? 'text-violet-300' : 'text-emerald-300'}"></i>
      <span class="font-mono">${state.slice === it.r && state.sliceMode === 'repo' ? '' : esc(it.r)}#${it.n}</span>
      ${it.sub ? `<span class="ml-auto flex items-center gap-1 tabular-nums" title="Sub-Issues erledigt"><i data-lucide="list-checks" class="w-3 h-3"></i>${it.sub[0]}/${it.sub[1]}</span>` : ''}
    </div>
    <h3 class="mt-1 text-[13px] leading-snug text-gray-100 line-clamp-2">${esc(it.t)}</h3>
    ${it.l.length ? `<div class="mt-1.5 flex flex-wrap gap-1">${it.l.slice(0, 3).map(labelChip).join('')}</div>` : ''}
    ${ags.length || prs.length ? `<div class="mt-2 pt-1.5 border-t border-gray-700/70 flex flex-wrap items-center gap-1.5">
      ${ags.map(a => `<button data-agent-chip="${a.id}" class="flex items-center gap-1 text-[11px] px-1.5 py-px rounded bg-gray-950/50 border border-gray-700 text-gray-200 hover:border-cursor hover:text-white" title="${esc(a.name)} · ${AGENT_STATE[a.state].label}"><span class="w-1.5 h-1.5 rounded-full ${AGENT_STATE[a.state].dot}"></span><i data-lucide="bot" class="w-3 h-3"></i><span class="font-mono">${a.id}</span></button>`).join('')}
      ${prs.map(([r, n, c]) => `<span class="flex items-center gap-1 text-[11px] text-gray-300" title="${ci[c][2]}"><i data-lucide="git-pull-request" class="w-3 h-3"></i>#${n}<i data-lucide="${ci[c][0]}" class="w-3 h-3 ${ci[c][1]}"></i></span>`).join('')}
    </div>` : ''}
  </article>`;
}

function laneKey(it) {
  if (state.lane === 'parent') return it.p ? [`p:${it.r}#${it.p}`, `${it.r}#${it.p} ${it.pt}`] : ['p:none', 'Ohne Parent issue'];
  if (state.lane === 'repo') return [`r:${it.r}`, it.r];
  return ['all', ''];
}

function renderBoard() {
  const items = visibleItems();
  document.getElementById('boardTitle').textContent = state.sliceMode === 'repo' && state.slice ? state.slice : state.slice || 'Alle Projekte';
  document.getElementById('boardCount').textContent = `${items.length} Items`;
  const lanes = new Map();
  items.forEach(it => { const [k, t] = laneKey(it); if (!lanes.has(k)) lanes.set(k, { t, items: [] }); lanes.get(k).items.push(it); });
  // Lanes with parents first, "no parent" last, like GitHub's board view
  const order = [...lanes].sort((a, b) => (a[0] === 'p:none') - (b[0] === 'p:none') || b[1].items.length - a[1].items.length);
  const recentDone = (it) => (TODAY - new Date(it.u)) / 864e5 <= DONE_DAYS;
  const cols = STATUSES.map(s => ({ s, n: items.filter(i => i.s === s && (s !== 'Done' || recentDone(i))).length }));
  const grid = `grid-template-columns: repeat(5, minmax(208px, 1fr)) ${state.doneOpen ? 'minmax(208px, 1fr)' : '44px'};`;

  let html = `<div style="min-width: ${state.doneOpen ? 1420 : 1200}px">
    <div class="sticky top-0 z-10 grid gap-2 px-[25px] pt-3 pb-2 bg-gray-900/95 backdrop-blur-sm border-b border-gray-700" style="${grid}">
      ${cols.map(c => c.s === 'Done' && !state.doneOpen
        ? `<button id="doneToggle" class="flex items-center justify-center rounded text-gray-400 hover:text-white hover:bg-gray-800" title="Done (letzte ${DONE_DAYS} Tage, ${c.n}) einblenden" aria-expanded="false"><i data-lucide="chevrons-left" class="w-4 h-4"></i></button>`
        : `<div class="flex items-center gap-2 px-2 py-1.5 rounded-md text-xs font-semibold text-gray-100" style="background:${COL_TINT[c.s]}24; box-shadow: inset 0 -2px 0 ${COL_TINT[c.s]}">
            <span class="w-2 h-2 rounded-full ${{ Backlog:'bg-gray-500', Todo:'bg-sky-300', 'In Progress':'bg-yellow-300', 'to Review':'bg-violet-300', 'to Deploy':'bg-orange-300', Done:'bg-emerald-300' }[c.s]}"></span>${c.s}
            <span class="font-normal text-gray-400 tabular-nums">${c.n}</span>
            ${c.s === 'Done' ? `<span class="font-normal text-[11px] text-gray-400">· ${DONE_DAYS} Tage</span><button id="doneToggle" class="ml-auto p-0.5 rounded text-gray-400 hover:text-white hover:bg-gray-800" aria-expanded="true" title="Done einklappen"><i data-lucide="chevrons-right" class="w-3.5 h-3.5"></i></button>` : ''}
          </div>`).join('')}
    </div>`;

  if (!items.length) html += `<div class="px-4 py-16 text-center text-gray-400">Keine Items in dieser Auswahl. <button id="resetAll" class="text-cursor hover:underline underline-offset-2">Filter zurücksetzen</button></div>`;

  for (const [k, lane] of order) {
    const collapsed = state.collapsed.has(k);
    const isParent = k.startsWith('p:') && k !== 'p:none';
    const done = lane.items.filter(i => i.s === 'Done').length;
    // Each lane is its own band: tinted surface, header bar, gap to the next lane
    if (state.lane !== 'none') html += `<section class="mx-3 mt-3 rounded-lg border border-gray-700 ${k === 'p:none' ? 'bg-gray-900' : 'bg-gray-950/45'} shadow-[0_2px_6px_-2px_rgba(0,0,0,.35)]">
      <button data-lane="${esc(k)}" aria-expanded="${!collapsed}" class="flex items-center gap-2 w-full px-3 py-2 text-[13px] font-semibold text-gray-100 hover:text-white ${collapsed ? '' : 'border-b border-gray-700/70'}">
        <i data-lucide="${collapsed ? 'chevron-right' : 'chevron-down'}" class="w-3.5 h-3.5 text-gray-400"></i>
        ${isParent ? `<i data-lucide="git-merge" class="w-3.5 h-3.5 text-cursor"></i><span class="font-mono text-xs text-gray-400">${esc(lane.t.split(' ')[0])}</span><span class="truncate">${esc(lane.t.split(' ').slice(1).join(' '))}</span>` : `<span class="text-gray-300">${esc(lane.t)}</span>`}
        <span class="ml-1 px-1.5 rounded-full bg-gray-800 text-[11px] font-normal text-gray-300 tabular-nums">${lane.items.length}</span>
        ${isParent ? `<span class="flex items-center gap-1.5 text-[11px] font-normal text-gray-400 tabular-nums"><span class="w-16 h-1 rounded-full bg-gray-800 overflow-hidden"><span class="block h-full bg-emerald-400" style="width:${Math.round(done / lane.items.length * 100)}%"></span></span>${done}/${lane.items.length} erledigt</span>` : ''}
      </button>`;
    if (collapsed) { if (state.lane !== 'none') html += `</section>`; continue; }
    html += `<div class="grid gap-2 px-3 py-2.5" style="${grid}">`;
    for (const s of STATUSES) {
      if (s === 'Done' && !state.doneOpen) { html += `<div data-drop="${esc(k)}|Done" class="lane-cell rounded border border-dashed border-gray-700/60" title="Auf Done ziehen"></div>`; continue; }
      const cell = lane.items.filter(i => i.s === s && (s !== 'Done' || recentDone(i)));
      const MAX = 6, shown = cell.slice(0, MAX);
      html += `<div data-drop="${esc(k)}|${s}" class="lane-cell rounded-md p-1.5 space-y-2" style="background:${COL_TINT[s]}14; box-shadow: inset 0 0 0 1px ${COL_TINT[s]}26">${shown.map(card).join('')}${cell.length > MAX ? `<button class="w-full text-[11px] text-gray-400 hover:text-white py-1">+ ${cell.length - MAX} weitere</button>` : ''}</div>`;
    }
    html += `</div>`;
    if (state.lane !== 'none') html += `</section>`;
  }
  html += `<div class="h-6"></div></div>`;
  const board = document.getElementById('board');
  board.innerHTML = html;

  board.querySelectorAll('[data-lane]').forEach(b => b.onclick = () => { state.collapsed.has(b.dataset.lane) ? state.collapsed.delete(b.dataset.lane) : state.collapsed.add(b.dataset.lane); renderBoard(); });
  board.querySelectorAll('#doneToggle').forEach(b => b.onclick = () => { state.doneOpen = !state.doneOpen; renderBoard(); });
  board.querySelector('#resetAll')?.addEventListener('click', () => { state.agent = null; state.q = ''; state.slice = null; render(); });
  board.querySelectorAll('.card').forEach(el => {
    const [r, n] = el.dataset.key.split('#');
    el.onclick = (e) => {
      const chip = e.target.closest('[data-agent-chip]');
      if (chip) { e.stopPropagation(); state.agent = chip.dataset.agentChip; render(); return; }
      openIssue(r, +n);
    };
    el.onkeydown = (e) => { if (e.key === 'Enter') openIssue(r, +n); };
    el.ondragstart = (e) => { e.dataTransfer.setData('text/plain', el.dataset.key); el.classList.add('dragging'); };
    el.ondragend = () => el.classList.remove('dragging');
  });
  board.querySelectorAll('[data-drop]').forEach(cell => {
    cell.ondragover = (e) => { e.preventDefault(); cell.classList.add('drop-target'); };
    cell.ondragleave = () => cell.classList.remove('drop-target');
    cell.ondrop = (e) => {
      e.preventDefault(); cell.classList.remove('drop-target');
      const key = e.dataTransfer.getData('text/plain'), to = cell.dataset.drop.split('|')[1];
      const it = ITEMS.find(i => keyOf(i.r, i.n) === key);
      if (!it || it.s === to) return;
      const from = it.s; it.s = to; if (to === 'Done') it.u = '2026-10-23';
      renderBoard();
      document.querySelector(`[data-key="${CSS.escape(key)}"]`)?.classList.add('flash');
      toast(`${key}: ${from} → ${to} · auf GitHub gesetzt`, () => { it.s = from; renderBoard(); });
    };
  });
  lucide.createIcons();
}

function openIssue(r, n) {
  const it = ITEMS.find(i => i.r === r && i.n === n);
  if (!it) { toast(`${r}#${n} ist nicht auf dem Board`); return; }
  if (state.sliceMode === 'repo' && state.slice && state.slice !== r) { state.slice = r; render(); }
  state.open = keyOf(r, n);
  const ags = agentsFor(it), prs = prsFor(it);
  const subs = ITEMS.filter(i => i.r === r && i.p === n);
  const d = document.getElementById('drawer');
  d.innerHTML = `
    <div class="flex items-center gap-2 px-4 h-12 border-b border-gray-700 shrink-0">
      <i data-lucide="${it.k === 'pr' ? 'git-pull-request' : 'circle-dot'}" class="w-4 h-4 text-emerald-300"></i>
      <span class="font-mono text-xs text-gray-400">${esc(r)}#${n}</span>
      <div class="flex-1"></div>
      <a href="https://github.com/hpmartini/${encodeURIComponent(r)}/issues/${n}" target="_blank" rel="noopener" class="flex items-center gap-1 px-2 py-1 rounded text-xs text-gray-300 hover:text-white hover:bg-gray-800"><i data-lucide="external-link" class="w-3.5 h-3.5"></i>GitHub</a>
      <button id="closeDrawer" class="p-1.5 rounded text-gray-400 hover:text-white hover:bg-gray-800" aria-label="Schließen (Esc)"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="flex-1 overflow-y-auto thin-scrollbar px-4 py-4 space-y-5">
      <h2 class="text-base font-semibold text-white leading-snug text-balance">${esc(it.t)}</h2>
      <dl class="grid grid-cols-[96px_1fr] gap-y-2 text-xs items-center">
        <dt class="text-gray-400">Status</dt>
        <dd><select id="statusSel" class="bg-gray-850 border border-gray-700 rounded px-2 py-1 text-gray-100">${STATUSES.map(s => `<option ${s === it.s ? 'selected' : ''}>${s}</option>`).join('')}</select></dd>
        <dt class="text-gray-400">Projekt</dt><dd class="text-gray-200">${esc(r)}</dd>
        <dt class="text-gray-400">Labels</dt><dd class="flex flex-wrap gap-1">${it.l.map(labelChip).join('') || '<span class="text-gray-400">keine</span>'}</dd>
        <dt class="text-gray-400">Parent</dt><dd class="text-gray-200">${it.p ? `<span class="font-mono text-gray-400">#${it.p}</span> ${esc(it.pt)}` : '<span class="text-gray-400">keiner</span>'}</dd>
        <dt class="text-gray-400">Aktualisiert</dt><dd class="text-gray-200 tabular-nums">${it.u}</dd>
      </dl>

      <section>
        <h3 class="text-xs font-semibold text-gray-300 mb-2 flex items-center gap-1.5"><i data-lucide="bot" class="w-3.5 h-3.5"></i>Agents an diesem Issue <span class="font-normal text-gray-400">${ags.length}</span></h3>
        ${ags.length ? `<ul class="space-y-1.5">${ags.map(a => `<li class="rounded-md border border-gray-700 bg-gray-850 px-3 py-2">
            <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ${AGENT_STATE[a.state].dot}"></span><span class="flex-1 min-w-0 truncate text-gray-100">${esc(a.name)}</span><span class="text-[11px] text-gray-400">${AGENT_STATE[a.state].label}</span></div>
            <div class="mt-1 text-[11px] text-gray-400">verknüpft über ${esc(a.via)}</div>
            <div class="mt-2 flex gap-1.5">
              <button class="flex items-center gap-1 px-2 py-1 rounded bg-sel text-white text-xs hover:bg-gray-750" onclick="toast('Mockup: springt nach /agents, Session ${a.id} angehängt')"><i data-lucide="terminal" class="w-3.5 h-3.5"></i>Im Agents-Modus öffnen</button>
              <button class="flex items-center gap-1 px-2 py-1 rounded text-gray-300 text-xs hover:text-white hover:bg-gray-800" onclick="state.agent='${a.id}';closeDrawer();render()"><i data-lucide="filter" class="w-3.5 h-3.5"></i>Seine Issues</button>
            </div></li>`).join('')}</ul>`
          : `<div class="rounded-md border border-dashed border-gray-700 px-3 py-3 text-xs text-gray-400 flex items-center gap-2">Kein Agent verknüpft.<button class="ml-auto flex items-center gap-1 px-2 py-1 rounded text-gray-200 hover:text-white hover:bg-gray-800" onclick="toast('Mockup: öffnet Dispatch mit ${esc(r)}#${n} vorbelegt')"><i data-lucide="play" class="w-3.5 h-3.5"></i>Agent starten</button></div>`}
      </section>

      <section>
        <h3 class="text-xs font-semibold text-gray-300 mb-2 flex items-center gap-1.5"><i data-lucide="git-pull-request" class="w-3.5 h-3.5"></i>Pull Requests <span class="font-normal text-gray-400">${prs.length}</span></h3>
        ${prs.length ? `<ul class="space-y-1 text-xs">${prs.map(([pr, pn, c]) => `<li class="flex items-center gap-2 text-gray-200"><span class="font-mono text-gray-400">#${pn}</span><span class="flex-1">${c === 'success' ? 'CI grün, mergebar' : c === 'failure' ? 'CI rot' : 'CI läuft'}</span><button class="text-cursor hover:underline underline-offset-2" onclick="toast('Mockup: öffnet Diff im Code-Modus')">Diff</button></li>`).join('')}</ul>` : `<p class="text-xs text-gray-400">Noch kein PR.</p>`}
      </section>

      ${subs.length ? `<section>
        <h3 class="text-xs font-semibold text-gray-300 mb-2 flex items-center gap-1.5"><i data-lucide="list-checks" class="w-3.5 h-3.5"></i>Sub-Issues <span class="font-normal text-gray-400">${subs.filter(s => s.s === 'Done').length}/${subs.length}</span></h3>
        <ul class="space-y-1 text-xs">${subs.map(s => `<li><button class="w-full flex items-center gap-2 text-left text-gray-200 hover:text-white" onclick="openIssue('${esc(s.r)}',${s.n})"><span class="font-mono text-gray-400">#${s.n}</span><span class="flex-1 truncate">${esc(s.t)}</span><span class="text-gray-400">${s.s}</span></button></li>`).join('')}</ul></section>` : ''}
    </div>`;
  d.classList.remove('translate-x-full'); d.setAttribute('aria-hidden', 'false');
  d.querySelector('#closeDrawer').onclick = closeDrawer;
  d.querySelector('#statusSel').onchange = (e) => { const from = it.s; it.s = e.target.value; renderBoard(); toast(`${r}#${n}: ${from} → ${it.s} · auf GitHub gesetzt`); };
  renderBoard();
  lucide.createIcons();
  d.querySelector('#closeDrawer').focus();
}
function closeDrawer() { const d = document.getElementById('drawer'); d.classList.add('translate-x-full'); d.setAttribute('aria-hidden', 'true'); state.open = null; renderBoard(); }

let toastTimer;
function toast(msg, undo) {
  const t = document.getElementById('toast');
  t.innerHTML = esc(msg) + (undo ? ` <button class="ml-2 text-cursor hover:underline underline-offset-2 pointer-events-auto">Rückgängig</button>` : '');
  t.style.opacity = 1; t.classList.toggle('pointer-events-none', !undo);
  if (undo) t.querySelector('button').onclick = () => { undo(); t.style.opacity = 0; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = 0; t.classList.add('pointer-events-none'); }, 4000);
}

function render() { renderSliceModes(); renderSlices(); renderAgents(); renderChips(); renderBoard(); }
document.getElementById('laneMode').onchange = (e) => { state.lane = e.target.value; renderBoard(); };
document.getElementById('q').oninput = (e) => { state.q = e.target.value; renderChips(); renderBoard(); lucide.createIcons(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open) closeDrawer(); });
render();
</script>
</body>
</html>
